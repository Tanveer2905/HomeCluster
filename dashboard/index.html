<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<title>PhoneCluster</title>
<link rel="icon" href="/static/brand/favicon.svg?v=7" type="image/svg+xml">
<link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<script>
  /* the theme picked with the top bar's button, applied before the page draws */
  try { var t = localStorage.getItem('pc_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { }
</script>
<link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>

<!-- ---------------- login ---------------- -->
<div id="login-screen" class="login-screen" hidden>
  <form id="login-form" class="login-box" autocomplete="off">
    <div class="login-logo" aria-hidden="true">
      <img class="logo-for-light" src="/static/brand/logo-for-light-256.png?v=7" alt="" width="88" height="88">
      <img class="logo-for-dark" src="/static/brand/logo-for-dark-256.png?v=7" alt="" width="88" height="88">
    </div>
    <h1 class="login-title">Sign in to PhoneCluster</h1>
    <p class="login-sub">Enter the 6-digit PIN from the coordinator console <span id="version" class="muted"></span></p>
    <label class="sr-only" for="pin-input">PIN</label>
    <input id="pin-input" class="input pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="6" placeholder="······" autocomplete="one-time-code" autofocus>
    <button id="login-btn" class="btn btn-primary btn-wide" type="submit">Unlock</button>
    <p id="login-msg" class="login-msg" role="status"></p>
  </form>
</div>

<!-- ---------------- app ---------------- -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="nav-toggle" class="icon-btn nav-toggle" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img class="logo-for-light" src="/static/brand/logo-for-light-256.png?v=7" alt="" width="28" height="28">
        <img class="logo-for-dark" src="/static/brand/logo-for-dark-256.png?v=7" alt="" width="28" height="28">
      </span>
      <span class="brand-text">PhoneCluster</span>
    </span>
    <span class="spacer"></span>
    <span id="conn" class="conn conn-idle" role="status" aria-live="polite">
      <span class="conn-dot" aria-hidden="true"></span><span id="conn-text">offline</span>
    </span>
    <button id="theme-btn" class="icon-btn" type="button" aria-label="Theme"></button>
    <button id="lock-btn" class="btn btn-sm">Lock</button>
  </header>
  <div class="shell">
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="/static/util.js?v=7"></script>
<script src="/static/api.js?v=7"></script>
<script src="/static/ws.js?v=7"></script>
<script src="/static/jobform.js?v=7"></script>
<script src="/static/views.js?v=7"></script>
<script src="/static/views2.js?v=7"></script>
<script src="/static/services.js?v=7"></script>
<script src="/static/models.js?v=7"></script>
<script src="/static/app.js?v=7"></script>
</body>
</html>
